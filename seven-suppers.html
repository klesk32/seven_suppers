ng",q:1,u:"packet",c:"pantry"},{n:"lime",q:1,u:"",c:"produce"},{n:"small flour tortillas",q:8,u:"",c:"grains"},{n:"shredded cheddar",q:1,u:"cup",c:"dairy"},{n:"romaine lettuce",q:1,u:"head",c:"produce"},{n:"tomatoes",q:2,u:"",c:"produce"},{n:"plain Greek yogurt",q:.5,u:"cup",c:"dairy"}],steps:["Cut the lettuce into thin ribbons and the tomatoes into small cubes. Put them in bowls on the table with the cheese and yogurt.","Put a large skillet on the stove over medium heat and let it warm up for 2 minutes.","Add the turkey and cook 7 to 8 minutes, breaking it into small crumbles with a wooden spoon. Push the meat into a mound at one side of the pan and poke an instant-read thermometer into the middle of it: ground turkey is done at 165 F.","Sprinkle the taco seasoning over the meat, add two-thirds of a cup of water, stir, and let it bubble gently 4 to 5 minutes until it thickens into a sauce. Squeeze half the lime in and stir.","Warm the tortillas: 20 seconds in the microwave under a damp paper towel, or 30 seconds per side in a dry pan.","Let everyone build their own. The yogurt stands in for sour cream."]},{id:"veggie-fried-rice",title:"Veggie Fried Rice with Eggs",time:20,tags:["veggie","fast"],ing:[{n:"white rice",q:1.5,u:"cup",c:"grains"},{n:"eggs",q:4,u:"",c:"dairy"},{n:"frozen peas and carrots",q:2,u:"cup",c:"produce"},{n:"garlic powder",q:.5,u:"tsp",c:"pantry"},{n:"green onions",q:1,u:"bunch",c:"produce"},{n:"low-sodium soy sauce",q:3,u:"tbsp",c:"pantry"},{n:"vegetable oil",q:2,u:"tbsp",c:"pantry"}],steps:["Cook the rice following the package directions, then spread it on a plate to cool while you prep. Leftover cold rice from another night works even better and skips this step.","Crack the eggs into a bowl and beat them with a fork until evenly yellow. Slice the green onions into thin rings.","Heat 1 tablespoon of the oil in your largest skillet over medium heat for 1 minute. Pour in the eggs, wait 20 seconds, then push them around with a spatula until they set into soft clumps, about 1 minute. Slide them onto a plate.","Add the rest of the oil to the pan, then the frozen peas and carrots straight from the bag. Sprinkle in the garlic powder and stir for 2 minutes.","Add the rice and cook 3 to 4 minutes, stirring every 30 seconds, until everything is hot.","Turn off the heat. Stir in the soy sauce, the eggs, and the green onions, and serve."]},{id:"creamy-tomato-pasta",title:"Creamy Tomato Pasta with Hidden Veggies",time:30,tags:["veggie","pasta"],ing:[{n:"penne pasta",q:12,u:"oz",c:"grains"},{n:"marinara sauce",q:1,u:"jar",c:"pantry"},{n:"zucchini",q:1,u:"",c:"produce"},{n:"carrots",q:2,u:"",c:"produce"},{n:"cream cheese",q:3,u:"oz",c:"dairy"},{n:"Italian seasoning",q:1,u:"tsp",c:"pantry"},{n:"parmesan",q:.5,u:"cup",c:"dairy"}],steps:["Fill your largest pot two-thirds with water, add a tablespoon of salt, cover, and bring it to a rolling boil over high heat.","While the water heats, peel the carrots and grate them and the zucchini on the large holes of a box grater. The zucchini skin can stay on.","Pour the marinara into a second pot over medium-low heat, stir in the grated vegetables and the Italian seasoning, and let it bubble gently for 8 minutes, stirring occasionally.","When the water boils, add the penne and cook for the time printed on the box. Before draining, scoop out a coffee mug of the cooking water, then drain the pasta in a colander.","Cut the cream cheese into chunks and stir it into the sauce until it melts smooth.","Mix the pasta into the sauce, adding splashes of the saved water if it looks too thick. Top with parmesan."]},{id:"chicken-tenders",title:"Baked Chicken Tenders and Sweet Potato Fries",time:35,tags:["chicken"],ing:[{n:"chicken tenderloins",q:1.25,u:"lb",c:"protein"},{n:"sweet potatoes",q:2,u:"",c:"produce"},{n:"panko breadcrumbs",q:1.5,u:"cup",c:"pantry"},{n:"smoked paprika",q:1,u:"tsp",c:"pantry"},{n:"garlic powder",q:.5,u:"tsp",c:"pantry"},{n:"eggs",q:2,u:"",c:"dairy"},{n:"olive oil",q:3,u:"tbsp",c:"pantry"},{n:"ketchup",q:.5,u:"cup",c:"pantry"}],steps:["Move an oven rack to the middle and heat the oven to 425 F. Get out two baking sheets.","Scrub the sweet potatoes (no peeling needed) and cut them into fries about as thick as your finger. Toss with 2 tablespoons of the olive oil and a big pinch of salt on one pan and spread them out flat.","Crack the eggs into a bowl and beat them with a fork. Pour the panko into a second bowl with the smoked paprika, the garlic powder, half a teaspoon of salt, and the last tablespoon of olive oil, and stir until the crumbs look slightly damp; this is what lets them turn golden.","One at a time: dip a tender in the egg, let the extra drip off, roll it in panko, press so the crumbs stick, and lay it on the second pan. Wash your hands when done.","Bake both pans 10 minutes, flip everything with tongs, then bake 10 more, until the tenders are golden. Poke an instant-read thermometer lengthwise into the thickest tender: it is done at 165 F.","Serve with ketchup."]},{id:"chickpea-curry",title:"Mild Chickpea Coconut Curry",time:25,tags:["veggie","vegan","fast"],ing:[{n:"canned chickpeas",q:2,u:"can",c:"pantry"},{n:"light coconut milk",q:1,u:"can",c:"pantry"},{n:"mild curry powder",q:3,u:"tsp",c:"pantry"},{n:"garam masala",q:.5,u:"tsp",c:"pantry"},{n:"lime",q:1,u:"",c:"produce"},{n:"spinach",q:3,u:"cup",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"white rice",q:1.5,u:"cup",c:"grains"}],steps:["Start the rice following the package directions. It takes about 20 minutes, so get it going first.","Peel the onion and chop it into small pieces, roughly pea-size. Uneven is fine.","Warm the olive oil in a medium pot over medium heat for 30 seconds. Add the onion and cook 4 minutes, stirring every minute, until it looks glassy instead of white.","Add the curry powder and garam masala and stir for 30 seconds until they smell toasty.","Open the chickpeas, pour them into a colander, and rinse under the tap. Add them and the whole can of coconut milk to the pot. Let it bubble gently, uncovered, for 10 minutes.","Turn off the heat and stir in the spinach a handful at a time until the leaves go dark and soft. Squeeze half the lime in, then spoon over the rice."]},{id:"chicken-noodle-soup",title:"Easy Chicken Noodle Soup",time:35,tags:["chicken","soup"],ing:[{n:"boneless chicken thighs",q:1,u:"lb",c:"protein"},{n:"carrots",q:3,u:"",c:"produce"},{n:"celery",q:3,u:"stalk",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"egg noodles",q:6,u:"oz",c:"grains"},{n:"dried thyme",q:.5,u:"tsp",c:"pantry"},{n:"bay leaf",q:1,u:"",c:"pantry"},{n:"low-sodium chicken broth",q:8,u:"cup",c:"pantry"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"}],steps:["Peel the carrots and onion. Cut the carrots and celery into coin-size pieces and chop the onion into small bits.","Warm the olive oil in your largest pot over medium heat for 30 seconds. Add the carrots, celery, and onion and cook 5 minutes, stirring every minute or two.","Pour in all the broth and add the chicken thighs whole, plus the thyme and the bay leaf. Bring to a gentle bubble and cook 15 minutes.","Poke an instant-read thermometer into the thickest thigh right in the pot: at 165 F it is done. Lift the chicken onto a plate with tongs, pull it into shreds with two forks, and put the shreds back in the pot.","Add the noodles and cook 8 more minutes, until a noodle you fish out and blow on is soft.","Fish out the bay leaf. Taste a cooled spoonful and add salt a pinch at a time until it tastes good to you."]},{id:"breakfast-burritos",title:"Egg and Black Bean Breakfast Burritos",time:20,tags:["veggie","fast"],ing:[{n:"eggs",q:8,u:"",c:"dairy"},{n:"canned black beans",q:1,u:"can",c:"pantry"},{n:"small flour tortillas",q:8,u:"",c:"grains"},{n:"bell pepper",q:1,u:"",c:"produce"},{n:"salsa",q:1,u:"jar",c:"pantry"},{n:"avocados",q:2,u:"",c:"produce"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"ground cumin",q:.5,u:"tsp",c:"pantry"},{n:"lime",q:1,u:"",c:"produce"}],steps:["Cut the bell pepper in half, pull out the stem, seeds, and white ribs, and chop it into small cubes.","Crack the eggs into a bowl with the cumin and beat them with a fork until evenly yellow. Open the beans, pour into a colander, and rinse.","Warm the olive oil in a large nonstick skillet over medium heat. Add the pepper and stir for 3 minutes.","Pour in the eggs. Wait 20 seconds, then push them slowly around with a spatula until just set and no longer runny, about 2 minutes. Turn off the heat.","Warm the beans in the microwave for 1 minute and the tortillas for 20 seconds under a damp paper towel.","Cut around each avocado the long way, twist the halves apart, remove the pit with a spoon, and slice the flesh. Squeeze lime juice over the slices.","Lay eggs, beans, salsa, and avocado down the middle of each tortilla, fold in the sides, and roll it up from the bottom."]},{id:"honey-garlic-stirfry",title:"Honey-Garlic Chicken Stir-Fry",time:25,tags:["chicken","fast"],ing:[{n:"boneless chicken thighs",q:1.25,u:"lb",c:"protein"},{n:"frozen stir-fry vegetables",q:1,u:"bag",c:"produce"},{n:"honey",q:3,u:"tbsp",c:"pantry"},{n:"ground ginger",q:.25,u:"tsp",c:"pantry"},{n:"low-sodium soy sauce",q:3,u:"tbsp",c:"pantry"},{n:"garlic",q:3,u:"clove",c:"produce"},{n:"vegetable oil",q:1,u:"tbsp",c:"pantry"},{n:"white rice",q:1.5,u:"cup",c:"grains"}],steps:["Start the rice following the package directions.","Cut the chicken into bite-size pieces on a cutting board. Wash the board, the knife, and your hands with soap right after.","Peel the garlic and chop it into tiny bits. Stir the honey, soy sauce, garlic, and ground ginger together in a small bowl.","Heat the oil in your largest skillet over medium-high until it shimmers. Add the chicken in one layer and leave it alone for 3 minutes, then stir and cook 3 more minutes.","Add the frozen vegetables straight from the bag and cook 4 minutes, stirring often.","Pour in the sauce and let it bubble 2 minutes until slightly sticky. Poke an instant-read thermometer into the biggest piece of chicken: 165 F means done. Serve over the rice."]},{id:"veggie-primavera",title:"Veggie Primavera Pasta",time:25,tags:["veggie","vegan","pasta","fast"],ing:[{n:"whole wheat penne",q:12,u:"oz",c:"grains"},{n:"zucchini",q:1,u:"",c:"produce"},{n:"cherry tomatoes",q:1,u:"pint",c:"produce"},{n:"dried oregano",q:.5,u:"tsp",c:"pantry"},{n:"frozen peas",q:1.5,u:"cup",c:"produce"},{n:"garlic",q:3,u:"clove",c:"produce"},{n:"olive oil",q:3,u:"tbsp",c:"pantry"},{n:"lemon",q:1,u:"",c:"produce"}],steps:["Fill your largest pot two-thirds with water, add a tablespoon of salt, cover, and bring to a rolling boil over high heat.","Cut the zucchini lengthwise into quarters, then across into small wedges. Cut the cherry tomatoes in half. Peel the garlic and chop it into tiny bits.","Add the penne to the boiling water and cook for the time on the box, dropping the frozen peas in for the last 2 minutes. Before draining, scoop out a coffee mug of the cooking water.","While the pasta cooks, warm the olive oil in a large skillet over medium heat. Add the zucchini and cook 3 minutes, then add the tomatoes, garlic, and oregano for 2 more.","Drain the pasta and peas and add them to the skillet. Stir, adding splashes of the saved water so everything glides instead of clumping.","Turn off the heat, squeeze the lemon over the top, add a pinch of salt, taste, and serve."]},{id:"turkey-meatballs",title:"Turkey Meatballs with Spaghetti",time:35,tags:["turkey","pasta"],ing:[{n:"ground turkey",q:1,u:"lb",c:"protein"},{n:"spaghetti",q:12,u:"oz",c:"grains"},{n:"marinara sauce",q:1,u:"jar",c:"pantry"},{n:"breadcrumbs",q:.5,u:"cup",c:"pantry"},{n:"Italian seasoning",q:1,u:"tsp",c:"pantry"},{n:"onion powder",q:.5,u:"tsp",c:"pantry"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"eggs",q:1,u:"",c:"dairy"},{n:"parmesan",q:.5,u:"cup",c:"dairy"}],steps:["Crack the egg into a large bowl. Add the turkey, breadcrumbs, Italian seasoning, onion powder, and half a teaspoon of salt, and mix with clean hands just until combined.","Roll the mix into balls the size of a golf ball and set them on a plate. Wash your hands after.","Warm the olive oil in a large skillet over medium heat. Add the meatballs and turn them every 2 minutes with tongs until browned in spots, about 6 minutes. They finish cooking in the sauce.","Pour the marinara over the meatballs, lower the heat to a gentle bubble, cover, and cook 12 minutes. Poke an instant-read thermometer into the middle of the biggest meatball: 165 F means done.","Meanwhile, boil a large pot of salted water and cook the spaghetti for the time on the box. Drain it in a colander.","Serve the spaghetti topped with meatballs, sauce, and parmesan."]},{id:"omelet-night",title:"Veggie Omelet Night with Toast",time:20,tags:["veggie","fast"],ing:[{n:"eggs",q:8,u:"",c:"dairy"},{n:"bell pepper",q:1,u:"",c:"produce"},{n:"spinach",q:2,u:"cup",c:"produce"},{n:"garlic powder",q:.25,u:"tsp",c:"pantry"},{n:"shredded cheddar",q:1,u:"cup",c:"dairy"},{n:"whole grain bread",q:1,u:"loaf",c:"grains"},{n:"butter",q:2,u:"tbsp",c:"dairy"}],steps:["Cut the bell pepper into small cubes. Melt a small pat of the butter in a nonstick skillet over medium heat, cook the pepper 2 minutes, then add the spinach until it wilts, about 1 minute. Scrape onto a plate.","For each omelet, crack 2 eggs into a bowl with a pinch of salt, a small pinch of garlic powder, and a little pepper, and beat with a fork until evenly yellow.","Melt another small pat of butter in the same pan over medium heat and pour in the eggs, tilting the pan so they cover the bottom.","When the edges look set and the top is damp but no longer liquid, about 1 minute, sprinkle a share of the vegetables and cheese over one half.","Slide a spatula under the empty half, fold it over the filling, and slide the omelet onto a plate. Repeat for each person.","Toast the bread, butter it, and serve alongside."]},{id:"fajita-bowls",title:"Chicken Fajita Bowls",time:30,tags:["chicken"],ing:[{n:"boneless chicken thighs",q:1.25,u:"lb",c:"protein"},{n:"bell pepper",q:2,u:"",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"white rice",q:1.5,u:"cup",c:"grains"},{n:"fajita seasoning",q:1,u:"packet",c:"pantry"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"garlic powder",q:.25,u:"tsp",c:"pantry"},{n:"shredded cheddar",q:1,u:"cup",c:"dairy"},{n:"lime",q:1,u:"",c:"produce"}],steps:["Start the rice following the package directions.","Cut the chicken into finger-width strips. Wash the board, knife, and your hands with soap right after. Cut the peppers and onion into strips too.","Warm the olive oil in your largest skillet over medium-high heat until it shimmers. Add the chicken, sprinkle the fajita seasoning over it, and cook 6 minutes, stirring halfway.","Add the peppers and onion and cook 6 more minutes, stirring now and then, until the vegetables are soft at the edges.","Poke an instant-read thermometer into the thickest strip of chicken: 165 F means done.","Stir half the lime's juice and the garlic powder into the cooked rice. Build bowls: rice on the bottom, chicken and vegetables on top, cheese over that, and a squeeze of the remaining lime."]},{id:"veggie-minestrone",title:"Weeknight Vegetable Minestrone",time:35,tags:["veggie","vegan","soup"],ing:[{n:"canned cannellini beans",q:1,u:"can",c:"pantry"},{n:"canned diced tomatoes",q:1,u:"can",c:"pantry"},{n:"carrots",q:2,u:"",c:"produce"},{n:"zucchini",q:1,u:"",c:"produce"},{n:"small pasta shells",q:1,u:"cup",c:"grains"},{n:"low-sodium vegetable broth",q:6,u:"cup",c:"pantry"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"dried oregano",q:1,u:"tsp",c:"pantry"},{n:"lemon",q:1,u:"",c:"produce"}],steps:["Peel the carrots. Cut the carrots and zucchini into coin-size pieces.","Warm the olive oil in your largest pot over medium heat for 30 seconds. Add the carrots and zucchini and cook 5 minutes, stirring every minute or two.","Open the beans, rinse them in a colander, and add them with the broth, the oregano, and the whole can of tomatoes, juice included. Bring to a gentle bubble and cook 10 minutes.","Add the pasta shells and cook 9 minutes, until one you fish out and blow on is soft.","Squeeze half the lemon in. Taste a cooled spoonful, add salt a pinch at a time until it tastes good, and ladle into bowls."]},{id:"turkey-bean-chili",title:"Turkey and White Bean Chili",time:35,tags:["turkey","soup"],ing:[{n:"ground turkey",q:1,u:"lb",c:"protein"},{n:"canned cannellini beans",q:2,u:"can",c:"pantry"},{n:"canned diced tomatoes",q:1,u:"can",c:"pantry"},{n:"frozen corn",q:1.5,u:"cup",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"chili powder",q:4.5,u:"tsp",c:"pantry"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"ground cumin",q:1,u:"tsp",c:"pantry"},{n:"lime",q:1,u:"",c:"produce"},{n:"low-sodium chicken broth",q:2,u:"cup",c:"pantry"}],steps:["Peel the onion and chop it into small pieces.","Warm the olive oil in your largest pot over medium heat. Add the turkey and onion and cook 6 to 8 minutes, breaking the meat into crumbles with a wooden spoon. Push the meat into a mound and poke an instant-read thermometer into the middle: ground turkey is done at 165 F.","Add the chili powder and cumin and stir for 30 seconds.","Open the beans, rinse them in a colander, and add them with the tomatoes (juice included), corn, and broth. Bring to a gentle bubble and cook 20 minutes, stirring occasionally.","Squeeze half the lime in. Taste a cooled spoonful and add salt a pinch at a time until it tastes right.","Ladle into bowls and let everyone add their own toppings."]},{id:"chicken-kebab-plates",title:"Oven Chicken and Veggie Kebab Plates",time:35,tags:["chicken"],ing:[{n:"boneless chicken thighs",q:1.25,u:"lb",c:"protein"},{n:"bell pepper",q:2,u:"",c:"produce"},{n:"zucchini",q:1,u:"",c:"produce"},{n:"red onion",q:1,u:"",c:"produce"},{n:"olive oil",q:3,u:"tbsp",c:"pantry"},{n:"white rice",q:1.5,u:"cup",c:"grains"},{n:"dried oregano",q:1,u:"tsp",c:"pantry"},{n:"smoked paprika",q:.5,u:"tsp",c:"pantry"},{n:"lemon",q:1,u:"",c:"produce"},{n:"plain Greek yogurt",q:1,u:"cup",c:"dairy"}],steps:["Start the rice following the package directions. Turn the broiler on high and move an oven rack about 6 inches below it. Line a baking sheet with foil.","Cut the chicken, peppers, zucchini, and onion into chunks of roughly the same size, about an inch. Wash the board, knife, and your hands with soap after the chicken.","Toss everything with the olive oil, the oregano, the smoked paprika, a teaspoon of salt, and some pepper, then thread onto skewers or just spread it on the pan.","Broil 6 to 7 minutes, turn everything with tongs, and broil 6 to 7 more, until the edges brown. Poke an instant-read thermometer into the middle of a big chicken chunk: 165 F means done.","Fluff the rice with a fork, squeeze the lemon over the chicken, and serve it all together with the yogurt for dipping."]},{id:"tofu-nuggets",title:"Crispy Tofu Nuggets with Rice and Cucumbers",time:30,tags:["veggie","vegan"],ing:[{n:"extra-firm tofu",q:1,u:"block",c:"protein"},{n:"cornstarch",q:3,u:"tbsp",c:"pantry"},{n:"vegetable oil",q:2,u:"tbsp",c:"pantry"},{n:"low-sodium soy sauce",q:3,u:"tbsp",c:"pantry"},{n:"maple syrup",q:2,u:"tbsp",c:"pantry"},{n:"garlic powder",q:.5,u:"tsp",c:"pantry"},{n:"ground ginger",q:.25,u:"tsp",c:"pantry"},{n:"white rice",q:1.5,u:"cup",c:"grains"},{n:"cucumbers",q:2,u:"",c:"produce"}],steps:["Start the rice following the package directions.","Open the tofu over the sink and pour off the water. Wrap the block in a clean kitchen towel and press it under a heavy plate for 5 minutes.","Cut the tofu into bite-size cubes and toss them gently in a bowl with the cornstarch until white all over.","Heat the oil in a nonstick skillet over medium-high until it shimmers. Add the tofu and turn the pieces every 2 minutes until golden on most sides, about 8 minutes total.","Turn off the heat, pour in the soy sauce and maple syrup with the garlic powder and ground ginger, and stir for 30 seconds until glossy.","Slice the cucumbers into rounds. Serve the tofu over rice with the cucumbers on the side."]},{id:"sweet-potato-bar",title:"Loaded Sweet Potato Bar",time:50,tags:["veggie","vegan"],ing:[{n:"sweet potatoes",q:4,u:"",c:"produce"},{n:"canned black beans",q:1,u:"can",c:"pantry"},{n:"frozen corn",q:1,u:"cup",c:"produce"},{n:"salsa",q:1,u:"jar",c:"pantry"},{n:"avocados",q:2,u:"",c:"produce"},{n:"green onions",q:1,u:"bunch",c:"produce"},{n:"ground cumin",q:.5,u:"tsp",c:"pantry"},{n:"lime",q:1,u:"",c:"produce"}],steps:["Heat the oven to 425 F. Wash the sweet potatoes and stab each one a few times with a fork so steam can escape.","Put them right on the oven rack and bake 40 to 45 minutes, until a knife slides into the middle with no resistance. In a hurry: microwave on a plate 10 to 12 minutes, turning once, until the knife test passes, instead.","Near the end, open the beans, rinse them in a colander, and warm them with the corn, the cumin, and a big squeeze of lime in a small pot or in the microwave for 2 minutes.","Cut around each avocado the long way, twist the halves apart, remove the pit with a spoon, and slice. Slice the green onions into thin rings.","Split the potatoes open, squeeze the ends so the insides fluff up, and let everyone load their own toppings: beans and corn, salsa, avocado, and green onions."]},{id:"pesto-pasta-peas",title:"Pesto Pasta with Peas and Chicken",time:25,tags:["chicken","pasta","fast"],ing:[{n:"rotini pasta",q:12,u:"oz",c:"grains"},{n:"basil pesto",q:1,u:"jar",c:"pantry"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"lemon",q:1,u:"",c:"produce"},{n:"boneless chicken thighs",q:1,u:"lb",c:"protein"},{n:"frozen peas",q:1.5,u:"cup",c:"produce"},{n:"parmesan",q:.5,u:"cup",c:"dairy"}],steps:["Fill your largest pot two-thirds with water, add a tablespoon of salt, cover, and bring to a rolling boil.","Cut the chicken into bite-size pieces. Wash the board, knife, and your hands with soap right after.","Add the rotini to the boiling water and cook for the time on the box, dropping the frozen peas in for the last 2 minutes. Scoop out a coffee mug of the cooking water before draining.","While the pasta cooks, warm the olive oil in a large skillet over medium-high heat. Add the chicken in one layer, leave it 4 minutes, then stir and cook 4 more. Poke an instant-read thermometer into a big piece: 165 F means done.","Turn off the heat. Add the drained pasta and peas, the whole jar of pesto, and a squeeze of half the lemon to the skillet, stirring in splashes of the saved water until everything is coated and glossy.","Top with parmesan and serve."]},{id:"turkey-burgers",title:"Turkey Burgers with Cucumber Salad",time:25,tags:["turkey","fast"],ing:[{n:"ground turkey",q:1.25,u:"lb",c:"protein"},{n:"whole wheat burger buns",q:4,u:"",c:"grains"},{n:"garlic powder",q:.5,u:"tsp",c:"pantry"},{n:"onion powder",q:.5,u:"tsp",c:"pantry"},{n:"romaine lettuce",q:1,u:"head",c:"produce"},{n:"tomatoes",q:2,u:"",c:"produce"},{n:"cucumbers",q:2,u:"",c:"produce"},{n:"olive oil",q:2,u:"tbsp",c:"pantry"},{n:"lemon",q:1,u:"",c:"produce"}],steps:["Put the turkey in a bowl with the garlic powder, onion powder, a teaspoon of salt, and some pepper. Mix briefly and shape into 4 patties a little wider than the buns (they shrink), pressing a small dimple into the center of each. Wash your hands after.","Slice the cucumbers and tomatoes, and toss them with 1 tablespoon of the olive oil, the juice of the lemon, and a pinch of salt.","Heat the rest of the oil in a large skillet over medium heat. Lay in the patties and cook 5 minutes per side without pressing on them.","Poke an instant-read thermometer through the side of a patty into its middle: ground turkey is done at 165 F. Color alone cannot tell you this, so cook another minute per side and check again if it reads low.","Optional: toast the buns cut-side down in the empty pan for 1 minute.","Build the burgers with lettuce and serve the salad on the side."]},{id:"chicken-shawarma-bowls",title:"Sheet-Pan Chicken Shawarma Bowls",time:40,tags:["chicken"],ing:[{n:"boneless chicken thighs",q:1.5,u:"lb",c:"protein"},{n:"canned chickpeas",q:1,u:"can",c:"pantry"},{n:"red onion",q:1,u:"",c:"produce"},{n:"ground cumin",q:2,u:"tsp",c:"pantry"},{n:"smoked paprika",q:1,u:"tsp",c:"pantry"},{n:"garlic powder",q:1,u:"tsp",c:"pantry"},{n:"olive oil",q:3,u:"tbsp",c:"pantry"},{n:"plain Greek yogurt",q:1,u:"cup",c:"dairy"},{n:"lemon",q:1,u:"",c:"produce"},{n:"pita bread",q:4,u:"",c:"grains"}],steps:["Move an oven rack to the middle and heat the oven to 425 F. Line a large rimmed baking sheet with foil.","Peel the red onion and cut it into thin wedges. Open the chickpeas, pour them into a colander, rinse under the tap, and shake them dry.","Put the chicken, onion, and chickpeas on the pan. Add the olive oil, cumin, smoked paprika, garlic powder, a teaspoon of salt, and some pepper, and mix with your hands until everything is coated. Spread it into a single layer. Wash your hands after touching raw chicken.","Roast 30 minutes without stirring. Poke an instant-read thermometer into the thickest piece of chicken: 165 F means done, and thighs are even better at 175 F.","While it roasts, stir the yogurt in a small bowl with the juice of half the lemon and a pinch of salt. That is your sauce.","Put the pitas in the oven for the last 2 minutes to warm.","Cut the chicken into strips, squeeze the rest of the lemon over the pan, and build bowls with torn pita, chicken, chickpeas, onion, and a spoon of yogurt sauce."]},{id:"chicken-tortilla-soup",title:"Chicken Tortilla Soup",time:35,tags:["chicken","soup"],ing:[{n:"boneless chicken thighs",q:1,u:"lb",c:"protein"},{n:"low-sodium chicken broth",q:6,u:"cup",c:"pantry"},{n:"canned black beans",q:1,u:"can",c:"pantry"},{n:"canned diced tomatoes",q:1,u:"can",c:"pantry"},{n:"frozen corn",q:1.5,u:"cup",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"chili powder",q:3,u:"tsp",c:"pantry"},{n:"ground cumin",q:1,u:"tsp",c:"pantry"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"lime",q:1,u:"",c:"produce"},{n:"avocados",q:1,u:"",c:"produce"},{n:"tortilla chips",q:1,u:"bag",c:"grains"}],steps:["Peel the onion and chop it into small pieces.","Warm the olive oil in your largest pot over medium heat. Add the onion and cook 4 minutes, stirring now and then, until it looks glassy instead of white.","Stir in the chili powder and cumin for 30 seconds, then pour in all the broth and add the chicken thighs whole. Bring to a gentle bubble and cook 15 minutes.","Poke an instant-read thermometer into the thickest thigh: at 165 F it is done. Lift it onto a plate, shred it with two forks, and return the shreds to the pot.","Open the beans, rinse them in a colander, and add them with the whole can of tomatoes, juice included, and the corn. Cook 5 more minutes.","Squeeze half the lime in. Taste a cooled spoonful and add salt a pinch at a time until it tastes good to you.","Slice the avocado. Ladle the soup into bowls and let everyone crush tortilla chips over the top."]},{id:"teriyaki-chicken-bowls",title:"Teriyaki Chicken Rice Bowls",time:25,tags:["chicken","fast"],ing:[{n:"boneless chicken thighs",q:1.25,u:"lb",c:"protein"},{n:"white rice",q:1.5,u:"cup",c:"grains"},{n:"low-sodium soy sauce",q:4,u:"tbsp",c:"pantry"},{n:"honey",q:3,u:"tbsp",c:"pantry"},{n:"rice vinegar",q:1,u:"tbsp",c:"pantry"},{n:"cornstarch",q:1,u:"tbsp",c:"pantry"},{n:"ground ginger",q:.25,u:"tsp",c:"pantry"},{n:"garlic",q:2,u:"clove",c:"produce"},{n:"frozen broccoli florets",q:1,u:"bag",c:"produce"},{n:"vegetable oil",q:1,u:"tbsp",c:"pantry"}],steps:["Start the rice following the package directions.","Cut the chicken into bite-size pieces. Wash the board, knife, and your hands with soap right after.","Peel the garlic and chop it into tiny bits. Stir the soy sauce, honey, rice vinegar, ground ginger, garlic, cornstarch, and 3 tablespoons of water together in a small bowl until no lumps are left.","Heat the oil in your largest skillet over medium-high until it shimmers. Add the chicken in one layer, leave it 3 minutes, then stir and cook 3 more.","Add the frozen broccoli straight from the bag with a splash of water, cover, and cook 4 minutes.","Stir the sauce again (the cornstarch settles to the bottom) and pour it in. Let it bubble 1 to 2 minutes until it turns glossy and clings to the chicken. Poke an instant-read thermometer into the biggest piece: 165 F means done.","Spoon everything over the rice."]},{id:"bbq-chicken-sheetpan",title:"Sheet-Pan BBQ Chicken and Potatoes",time:45,tags:["chicken"],ing:[{n:"boneless chicken thighs",q:1.5,u:"lb",c:"protein"},{n:"baby potatoes",q:1.5,u:"lb",c:"produce"},{n:"green beans",q:.75,u:"lb",c:"produce"},{n:"barbecue sauce",q:1,u:"bottle",c:"pantry"},{n:"olive oil",q:2,u:"tbsp",c:"pantry"},{n:"smoked paprika",q:1,u:"tsp",c:"pantry"},{n:"garlic powder",q:.5,u:"tsp",c:"pantry"}],steps:["Move an oven rack to the middle and heat the oven to 425 F. Line a large rimmed baking sheet with foil. Do not skip the foil here, because barbecue sauce bakes onto a bare pan like glue.","Rinse the potatoes and cut each one in half. Toss them on the pan with 1 tablespoon of the olive oil, the smoked paprika, the garlic powder, and a big pinch of salt, then push them to one side.","Put the chicken on the empty side, rub it with the rest of the oil and a teaspoon of salt, and wash your hands.","Roast 20 minutes. Set a timer.","Snap the stem ends off the green beans. Scatter them over the pan, then brush the chicken generously with barbecue sauce.","Roast 15 more minutes. Poke an instant-read thermometer into the thickest piece of chicken: 165 F means done, and 175 F makes thighs even more tender.","Serve with more barbecue sauce on the side."]},{id:"sesame-noodles-chicken",title:"Sesame Noodles with Chicken and Cucumber",time:25,tags:["chicken","pasta","fast"],ing:[{n:"spaghetti",q:12,u:"oz",c:"grains"},{n:"boneless chicken thighs",q:1,u:"lb",c:"protein"},{n:"low-sodium soy sauce",q:3,u:"tbsp",c:"pantry"},{n:"toasted sesame oil",q:2,u:"tbsp",c:"pantry"},{n:"honey",q:1,u:"tbsp",c:"pantry"},{n:"rice vinegar",q:1,u:"tbsp",c:"pantry"},{n:"garlic powder",q:.5,u:"tsp",c:"pantry"},{n:"cucumbers",q:2,u:"",c:"produce"},{n:"green onions",q:1,u:"bunch",c:"produce"},{n:"vegetable oil",q:1,u:"tbsp",c:"pantry"}],steps:["Fill your largest pot two-thirds with water, add a tablespoon of salt, cover, and bring it to a rolling boil over high heat.","Cut the chicken into bite-size pieces. Wash the board, knife, and your hands with soap right after.","Stir the soy sauce, sesame oil, honey, rice vinegar, and garlic powder together in a small bowl. Slice the cucumbers into thin half-moons and the green onions into rings.","Add the spaghetti to the boiling water and cook for the time on the box. Before draining, scoop out a coffee mug of the cooking water.","While the pasta cooks, heat the vegetable oil in a large skillet over medium-high. Add the chicken in one layer, leave it 4 minutes, then stir and cook 4 more. Poke an instant-read thermometer into a big piece: 165 F means done.","Turn off the heat. Add the drained spaghetti and the sauce to the skillet and toss, loosening with splashes of the saved water until the noodles are slick instead of sticky.","Pile the cucumbers and green onions on top. This one is good hot or at room temperature."]},{id:"lemon-orzo-chicken-soup",title:"Lemon Orzo Chicken Soup",time:35,tags:["chicken","soup"],ing:[{n:"boneless chicken thighs",q:1,u:"lb",c:"protein"},{n:"orzo",q:1,u:"cup",c:"grains"},{n:"low-sodium chicken broth",q:8,u:"cup",c:"pantry"},{n:"carrots",q:3,u:"",c:"produce"},{n:"celery",q:3,u:"stalk",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"spinach",q:3,u:"cup",c:"produce"},{n:"dried oregano",q:.5,u:"tsp",c:"pantry"},{n:"lemon",q:2,u:"",c:"produce"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"}],steps:["Peel the carrots and onion. Cut the carrots and celery into coin-size pieces and chop the onion into small bits.","Warm the olive oil in your largest pot over medium heat for 30 seconds. Add the carrots, celery, and onion and cook 5 minutes, stirring every minute or two.","Pour in all the broth, add the chicken thighs whole and the oregano, and bring to a gentle bubble. Cook 15 minutes.","Poke an instant-read thermometer into the thickest thigh: at 165 F it is done. Lift it onto a plate, shred it with two forks, and return the shreds to the pot.","Add the orzo and cook 8 minutes, stirring now and then so it does not stick to the bottom, until one you fish out and blow on is soft.","Turn off the heat. Stir in the spinach until the leaves go dark, then squeeze in the juice of both lemons. Taste a cooled spoonful and add salt a pinch at a time until it tastes bright."]},{id:"honey-mustard-chicken",title:"Honey-Mustard Chicken with Green Beans",time:40,tags:["chicken"],ing:[{n:"boneless chicken thighs",q:1.5,u:"lb",c:"protein"},{n:"baby potatoes",q:1.5,u:"lb",c:"produce"},{n:"green beans",q:.75,u:"lb",c:"produce"},{n:"Dijon mustard",q:3,u:"tbsp",c:"pantry"},{n:"honey",q:3,u:"tbsp",c:"pantry"},{n:"olive oil",q:3,u:"tbsp",c:"pantry"},{n:"garlic powder",q:1,u:"tsp",c:"pantry"},{n:"dried thyme",q:.5,u:"tsp",c:"pantry"}],steps:["Move an oven rack to the middle and heat the oven to 425 F. Line a large rimmed baking sheet with foil.","Stir the Dijon, honey, 1 tablespoon of the olive oil, the garlic powder, and the thyme together in a small bowl.","Rinse the potatoes and cut each one in half. Toss them on the pan with the rest of the oil and a big pinch of salt, and spread them out flat. Roast 15 minutes.","Push the potatoes to one side of the pan. Lay the chicken on the empty side, spoon the honey-mustard over it, and wash your hands after touching raw chicken.","Roast 15 minutes.","Snap the stem ends off the green beans, scatter them around the pan, and roast 8 more minutes. Poke an instant-read thermometer into the thickest piece of chicken: 165 F means done, 175 F for extra-tender thighs."]},{id:"chicken-enchilada-skillet",title:"Chicken Enchilada Skillet",time:30,tags:["chicken"],ing:[{n:"boneless chicken thighs",q:1.25,u:"lb",c:"protein"},{n:"small corn tortillas",q:8,u:"",c:"grains"},{n:"enchilada sauce",q:1,u:"can",c:"pantry"},{n:"canned black beans",q:1,u:"can",c:"pantry"},{n:"frozen corn",q:1,u:"cup",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"ground cumin",q:1,u:"tsp",c:"pantry"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"shredded cheddar",q:1,u:"cup",c:"dairy"},{n:"lime",q:1,u:"",c:"produce"}],steps:["Cut the chicken into bite-size pieces and chop the onion small. Wash the board, knife, and your hands with soap right after the chicken.","Warm the olive oil in your largest skillet over medium-high heat. Add the chicken and onion and cook 7 minutes, stirring twice.","Sprinkle in the cumin and stir 30 seconds. Poke an instant-read thermometer into the biggest piece of chicken: 165 F means done.","Open the beans, rinse them in a colander, and stir them in with the corn and the whole can of enchilada sauce. Let it bubble gently 3 minutes.","Stack the tortillas, cut them into strips about an inch wide, and fold them into the skillet so they soften in the sauce, about 3 minutes.","Turn off the heat and squeeze in half the lime. Sprinkle cheese over the side of the pan belonging to whoever wants it, and serve straight from the skillet."]},{id:"coconut-butter-chicken",title:"Mild Coconut Butter Chicken",time:35,tags:["chicken"],ing:[{n:"boneless chicken thighs",q:1.5,u:"lb",c:"protein"},{n:"canned tomato sauce",q:1,u:"can",c:"pantry"},{n:"light coconut milk",q:1,u:"can",c:"pantry"},{n:"garam masala",q:3,u:"tsp",c:"pantry"},{n:"mild curry powder",q:1,u:"tsp",c:"pantry"},{n:"ground ginger",q:.5,u:"tsp",c:"pantry"},{n:"garlic",q:3,u:"clove",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"butter",q:2,u:"tbsp",c:"dairy"},{n:"white rice",q:1.5,u:"cup",c:"grains"},{n:"lemon",q:1,u:"",c:"produce"}],steps:["Start the rice following the package directions.","Cut the chicken into bite-size pieces. Wash the board, knife, and your hands with soap right after. Peel and chop the onion small and chop the garlic into tiny bits.","Melt the butter in your largest skillet over medium heat. Add the onion and cook 5 minutes until glassy, then add the garlic, garam masala, curry powder, and ground ginger and stir 30 seconds until they smell toasty.","Add the chicken and stir to coat, then pour in the whole can of tomato sauce and the whole can of coconut milk. Stir and bring to a gentle bubble.","Cook uncovered 15 minutes, stirring every few minutes, until the sauce darkens and thickens enough to coat the back of a spoon.","Poke an instant-read thermometer into the biggest piece of chicken: 165 F means done. Squeeze in half the lemon, add salt to taste, and spoon over the rice."]},{id:"turkey-sloppy-joes",title:"Turkey Sloppy Joes",time:25,tags:["turkey","fast"],ing:[{n:"ground turkey",q:1.25,u:"lb",c:"protein"},{n:"canned tomato sauce",q:1,u:"can",c:"pantry"},{n:"ketchup",q:.25,u:"cup",c:"pantry"},{n:"Dijon mustard",q:1,u:"tbsp",c:"pantry"},{n:"brown sugar",q:3,u:"tsp",c:"pantry"},{n:"onion",q:1,u:"",c:"produce"},{n:"bell pepper",q:1,u:"",c:"produce"},{n:"chili powder",q:1,u:"tsp",c:"pantry"},{n:"garlic powder",q:.5,u:"tsp",c:"pantry"},{n:"whole wheat burger buns",q:4,u:"",c:"grains"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"}],steps:["Peel the onion and chop it small. Cut the bell pepper in half, pull out the stem, seeds, and white ribs, and chop it small too.","Warm the olive oil in a large skillet over medium heat. Add the onion and pepper and cook 4 minutes, stirring now and then.","Add the turkey and cook 7 minutes, breaking it into small crumbles with a wooden spoon. Push the meat into a mound at one side of the pan and poke an instant-read thermometer into the middle: ground turkey is done at 165 F.","Stir in the chili powder and garlic powder for 30 seconds, then add the tomato sauce, ketchup, Dijon, and brown sugar.","Let it bubble gently 8 minutes, stirring now and then, until it thickens enough to sit on a spoon instead of running off. Taste and add salt a pinch at a time.","Toast the buns cut-side down in a dry pan for a minute, then spoon the filling in."]},{id:"turkey-stuffed-peppers",title:"Turkey and Rice Stuffed Peppers",time:50,tags:["turkey"],ing:[{n:"ground turkey",q:1,u:"lb",c:"protein"},{n:"bell pepper",q:4,u:"",c:"produce"},{n:"white rice",q:1,u:"cup",c:"grains"},{n:"canned diced tomatoes",q:1,u:"can",c:"pantry"},{n:"onion",q:1,u:"",c:"produce"},{n:"Italian seasoning",q:1,u:"tsp",c:"pantry"},{n:"garlic powder",q:.5,u:"tsp",c:"pantry"},{n:"low-sodium chicken broth",q:1,u:"cup",c:"pantry"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"shredded cheddar",q:.5,u:"cup",c:"dairy"}],steps:["Start the rice following the package directions. Heat the oven to 400 F.","Cut the peppers in half through the stem and pull out the seeds and white ribs. Stand them cut-side up in a baking dish.","Peel and chop the onion small. Warm the olive oil in a large skillet over medium heat, add the onion, and cook 4 minutes.","Add the turkey, the Italian seasoning, the garlic powder, and a teaspoon of salt, and cook 7 minutes, breaking the meat into crumbles. Push it into a mound and poke an instant-read thermometer into the middle: ground turkey is done at 165 F.","Stir in the cooked rice and the whole can of tomatoes with their juice, then spoon the mix into the pepper halves, mounding it up.","Pour the broth into the bottom of the dish, cover it tightly with foil, and bake 35 minutes, until a knife slides through a pepper wall easily.","Uncover, sprinkle cheese on the halves that want it, and bake 5 more minutes."]},{id:"turkey-meatball-soup",title:"Turkey Meatball and Orzo Soup",time:40,tags:["turkey","soup"],ing:[{n:"ground turkey",q:1,u:"lb",c:"protein"},{n:"breadcrumbs",q:.5,u:"cup",c:"pantry"},{n:"eggs",q:1,u:"",c:"dairy"},{n:"orzo",q:.75,u:"cup",c:"grains"},{n:"low-sodium chicken broth",q:8,u:"cup",c:"pantry"},{n:"carrots",q:3,u:"",c:"produce"},{n:"celery",q:2,u:"stalk",c:"produce"},{n:"spinach",q:3,u:"cup",c:"produce"},{n:"Italian seasoning",q:1,u:"tsp",c:"pantry"},{n:"garlic powder",q:.5,u:"tsp",c:"pantry"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"},{n:"lemon",q:1,u:"",c:"produce"}],steps:["Crack the egg into a large bowl. Add the turkey, breadcrumbs, Italian seasoning, garlic powder, and half a teaspoon of salt, and mix with clean hands just until combined.","Roll the mix into small balls about the size of a walnut and set them on a plate. Wash your hands after.","Peel the carrots. Cut the carrots and celery into coin-size pieces. Warm the olive oil in your largest pot over medium heat and cook them 5 minutes, stirring now and then.","Pour in all the broth and bring it to a gentle bubble. Lower the meatballs in one at a time and cook 10 minutes, stirring as little as possible so they hold together.","Add the orzo and cook 8 more minutes. Poke an instant-read thermometer into the middle of the biggest meatball: 165 F means done.","Turn off the heat, stir in the spinach until the leaves go dark, and squeeze in half the lemon. Taste a cooled spoonful and add salt a pinch at a time."]},{id:"turkey-egg-roll-bowls",title:"Turkey Egg Roll Bowls",time:25,tags:["turkey","fast"],ing:[{n:"ground turkey",q:1.25,u:"lb",c:"protein"},{n:"coleslaw mix",q:1,u:"bag",c:"produce"},{n:"low-sodium soy sauce",q:3,u:"tbsp",c:"pantry"},{n:"toasted sesame oil",q:1,u:"tbsp",c:"pantry"},{n:"rice vinegar",q:1,u:"tbsp",c:"pantry"},{n:"ground ginger",q:.5,u:"tsp",c:"pantry"},{n:"garlic",q:3,u:"clove",c:"produce"},{n:"green onions",q:1,u:"bunch",c:"produce"},{n:"white rice",q:1.5,u:"cup",c:"grains"},{n:"vegetable oil",q:1,u:"tbsp",c:"pantry"}],steps:["Start the rice following the package directions.","Peel the garlic and chop it into tiny bits. Slice the green onions into thin rings. Stir the soy sauce, sesame oil, rice vinegar, and ground ginger together in a small bowl.","Heat the vegetable oil in your largest skillet over medium-high. Add the turkey and cook 8 minutes, breaking it into crumbles with a wooden spoon. Push the meat into a mound and poke an instant-read thermometer into the middle: ground turkey is done at 165 F.","Add the garlic and stir for 30 seconds.","Dump in the whole bag of coleslaw mix and cook 5 minutes, stirring often, until the cabbage wilts down but still has a little crunch.","Pour in the sauce, stir 1 minute, and turn off the heat. Serve over the rice with the green onions scattered on top."]},{id:"red-lentil-soup",title:"Red Lentil and Coconut Soup",time:35,tags:["veggie","vegan","soup"],ing:[{n:"red lentils",q:1.5,u:"cup",c:"pantry"},{n:"light coconut milk",q:1,u:"can",c:"pantry"},{n:"low-sodium vegetable broth",q:6,u:"cup",c:"pantry"},{n:"carrots",q:3,u:"",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"garlic",q:3,u:"clove",c:"produce"},{n:"mild curry powder",q:3,u:"tsp",c:"pantry"},{n:"ground cumin",q:1,u:"tsp",c:"pantry"},{n:"spinach",q:3,u:"cup",c:"produce"},{n:"lime",q:1,u:"",c:"produce"},{n:"olive oil",q:1,u:"tbsp",c:"pantry"}],steps:["Peel the carrots and onion. Chop the onion small and cut the carrots into coin-size pieces. Peel the garlic and chop it into tiny bits.","Warm the olive oil in your largest pot over medium heat. Add the onion and carrots and cook 5 minutes, stirring now and then.","Add the garlic, curry powder, and cumin and stir 30 seconds until they smell toasty.","Pour the lentils into a colander and rinse them under the tap. Add them to the pot with all the broth and the whole can of coconut milk.","Bring to a gentle bubble and cook 20 minutes, stirring every few minutes so nothing sticks to the bottom, until the lentils have fallen apart and the soup is thick.","Turn off the heat, stir in the spinach until the leaves go dark, and squeeze in half the lime. Taste a cooled spoonful and add salt a pinch at a time."]},{id:"peanut-noodles-tofu",title:"Peanut Noodles with Tofu and Edamame",time:25,tags:["veggie","vegan","pasta","fast"],ing:[{n:"spaghetti",q:12,u:"oz",c:"grains"},{n:"extra-firm tofu",q:1,u:"block",c:"protein"},{n:"creamy peanut butter",q:.5,u:"cup",c:"pantry"},{n:"low-sodium soy sauce",q:3,u:"tbsp",c:"pantry"},{n:"rice vinegar",q:2,u:"tbsp",c:"pantry"},{n:"toasted sesame oil",q:1,u:"tbsp",c:"pantry"},{n:"maple syrup",q:1,u:"tbsp",c:"pantry"},{n:"ground ginger",q:.25,u:"tsp",c:"pantry"},{n:"cornstarch",q:2,u:"tbsp",c:"pantry"},{n:"frozen shelled edamame",q:1.5,u:"cup",c:"produce"},{n:"cucumbers",q:1,u:"",c:"produce"},{n:"green onions",q:1,u:"bunch",c:"produce"},{n:"vegetable oil",q:2,u:"tbsp",c:"pantry"}],steps:["Fill your largest pot two-thirds with water, add a tablespoon of salt, cover, and bring it to a rolling boil over high heat.","Open the tofu over the sink and pour off the water. Wrap the block in a clean kitchen towel and press it under a heavy plate for 5 minutes, then cut it into bite-size cubes and toss them gently with the cornstarch until white all over.","In a bowl, stir the peanut butter, soy sauce, rice vinegar, sesame oil, maple syrup, ground ginger, and 6 tablespoons of warm water until smooth and pourable. Add water a spoonful at a time if it stays stiff.","Cook the spaghetti for the time on the box, dropping the frozen edamame in for the last 3 minutes. Scoop out a coffee mug of the cooking water before draining.","While the pasta cooks, heat the vegetable oil in a nonstick skillet over medium-high until it shimmers. Add the tofu and turn the pieces every 2 minutes until golden on most sides, about 8 minutes total.","Toss the drained noodles and edamame with the peanut sauce back in the big pot, loosening with splashes of the saved water until everything is evenly coated.","Slice the cucumber into thin half-moons and the green onions into rings, and scatter both over the top along with the tofu."]},{id:"black-bean-burgers",title:"Black Bean Burgers with Oven Fries",time:50,tags:["veggie","vegan"],ing:[{n:"canned black beans",q:2,u:"can",c:"pantry"},{n:"rolled oats",q:1,u:"cup",c:"grains"},{n:"russet potatoes",q:2,u:"",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"ground cumin",q:1,u:"tsp",c:"pantry"},{n:"smoked paprika",q:1,u:"tsp",c:"pantry"},{n:"garlic powder",q:1,u:"tsp",c:"pantry"},{n:"whole wheat burger buns",q:4,u:"",c:"grains"},{n:"romaine lettuce",q:1,u:"head",c:"produce"},{n:"tomatoes",q:1,u:"",c:"produce"},{n:"ketchup",q:.25,u:"cup",c:"pantry"},{n:"olive oil",q:3,u:"tbsp",c:"pantry"}],steps:["Heat the oven to 425 F and line two baking sheets with foil.","Scrub the potatoes (no peeling needed) and cut them into fries about as thick as your finger. Toss with 2 tablespoons of the olive oil and a big pinch of salt on one pan, spread them flat, and roast 30 minutes, flipping once with a spatula halfway.","Open the beans, rinse them in a colander, and shake them very dry. Spread them on the second pan and bake 10 minutes to dry them out. This step is what keeps the burgers from turning to mush.","Tip the beans into a big bowl and mash them with a fork or potato masher until most are broken but some whole ones remain. Peel and finely chop the onion and stir it in with the oats, cumin, smoked paprika, garlic powder, and a teaspoon of salt.","Squeeze the mix into 4 patties, packing them tight so they hold. Wipe the bean pan, brush it with the last tablespoon of olive oil, and set the patties on it.","Bake 12 minutes, flip carefully with a thin spatula, and bake 12 more, until the outsides are firm and dry to the touch.","Build the burgers on the buns with lettuce, sliced tomato, and ketchup, and serve the fries alongside."]},{id:"shakshuka",title:"Skillet Eggs in Spiced Tomato Sauce",time:30,tags:["veggie"],ing:[{n:"eggs",q:8,u:"",c:"dairy"},{n:"canned crushed tomatoes",q:1,u:"can",c:"pantry"},{n:"bell pepper",q:2,u:"",c:"produce"},{n:"onion",q:1,u:"",c:"produce"},{n:"garlic",q:3,u:"clove",c:"produce"},{n:"ground cumin",q:1,u:"tsp",c:"pantry"},{n:"smoked paprika",q:1,u:"tsp",c:"pantry"},{n:"olive oil",q:2,u:"tbsp",c:"pantry"},{n:"whole grain bread",q:1,u:"loaf",c:"grains"}],steps:["Cut the peppers in half, pull out the stems, seeds, and white ribs, and slice them into thin strips. Peel and chop the onion small and chop the garlic into tiny bits.","Warm the olive oil in a large skillet over medium heat. Add the peppers and onion and cook 8 minutes, stirring now and then, until they are soft and floppy.","Add the garlic, cumin, and smoked paprika and stir 30 seconds until they smell toasty.","Pour in the whole can of crushed tomatoes with a teaspoon of salt. Let it bubble gently for 10 minutes, stirring often, until it thickens enough that dragging a spoon through leaves a trench for a second.","Make 8 shallow wells in the sauce with the back of a spoon and crack one egg into each.","Cover the pan, turn the heat to medium-low, and cook 7 to 10 minutes. The whites should be firm and no longer see-through; the yolks can be as runny or set as you like.","Toast the bread and serve it alongside for scooping."]},{id:"sweet-potato-tacos",title:"Sweet Potato and Black Bean Tacos",time:40,tags:["veggie","vegan"],ing:[{n:"sweet potatoes",q:3,u:"",c:"produce"},{n:"canned black beans",q:1,u:"can",c:"pantry"},{n:"small corn tortillas",q:8,u:"",c:"grains"},{n:"ground cumin",q:1.5,u:"tsp",c:"pantry"},{n:"chili powder",q:1,u:"tsp",c:"pantry"},{n:"smoked paprika",q:.5,u:"tsp",c:"pantry"},{n:"olive oil",q:3,u:"tbsp",c:"pantry"},{n:"romaine lettuce",q:1,u:"head",c:"produce"},{n:"avocados",q:1,u:"",c:"produce"},{n:"green onions",q:1,u:"bunch",c:"produce"},{n:"lime",q:1,u:"",c:"produce"}],steps:["Heat the oven to 425 F and line a large rimmed baking sheet with foil.","Scrub the sweet potatoes (no peeling needed) and cut them into cubes about an inch across. Toss them on the pan with 2 tablespoons of the olive oil, the cumin, chili powder, smoked paprika, and a teaspoon of salt, then spread them into a single layer.","Roast 30 minutes, turning everything with a spatula halfway through, until the edges are browned and a fork slides into a cube with no resistance.","Near the end, open the beans, rinse them in a colander, and warm them in a small pot with the last tablespoon of olive oil and a squeeze of lime, about 3 minutes.","Cut the lettuce into thin ribbons and slice the green onions into rings. Cut around the avocado the long way, twist the halves apart, remove the pit with a spoon, and slice the flesh.","Warm the tortillas 20 seconds in the microwave under a damp paper towel, or 30 seconds per side in a dry pan.","Build tacos with sweet potato, beans, lettuce, avocado, and green onion, and squeeze the rest of the lime over the top."]},{id:"pasta-e-ceci",title:"Chickpea and Tomato Pasta Stew",time:30,tags:["veggie","vegan","pasta","soup"],ing:[{n:"canned chickpeas",q:2,u:"can",c:"pantry"},{n:"small pasta shells",q:1.5,u:"cup",c:"grains"},{n:"canned crushed tomatoes",q:1,u:"can",c:"pantry"},{n:"low-sodium vegetable broth",q:4,u:"cup",c:"pantry"},{n:"garlic",q:4,u:"clove",c:"produce"},{n:"dried rosemary",q:.5,u:"tsp",c:"pantry"},{n:"dried oregano",q:1,u:"tsp",c:"pantry"},{n:"olive oil",q:3,u:"tbsp",c:"pantry"},{n:"lemon",q:1,u:"",c:"produce"}],steps:["Peel the garlic and chop it into tiny bits.","Warm 2 tablespoons of the olive oil in your largest pot over medium heat. Add the garlic, rosemary, and oregano and stir for 1 minute, until fragrant but not browned. Browned garlic turns bitter, so keep it moving.","Open the chickpeas, rinse them in a colander, and add them to the pot. Mash about a third of them against the side with a wooden spoon; that is what makes the broth creamy without any cream.","Add the whole can of crushed tomatoes and all the broth, bring to a gentle bubble, and cook 10 minutes.","Add the pasta shells and cook 10 more minutes, stirring often so they do not stick, until one you fish out and blow on is soft. It should look like a loose stew, so add a splash of water if it tightens too much.","Turn off the heat, squeeze in half the lemon, drizzle the last tablespoon of olive oil over the top, and salt to taste."]},{id:"veggie-lo-mein",title:"Veggie Lo Mein",time:25,tags:["veggie","vegan","pasta","fast"],ing:[{n:"spaghetti",q:12,u:"oz",c:"grains"},{n:"frozen stir-fry vegetables",q:1,u:"bag",c:"produce"},{n:"low-sodium soy sauce",q:4,u:"tbsp",c:"pantry"},{n:"toasted sesame oil",q:1,u:"tbsp",c:"pantry"},{n:"brown sugar",q:1,u:"tsp",c:"pantry"},{n:"ground ginger",q:.25,u:"tsp",c:"pantry"},{n:"cornstarch",q:.5,u:"tbsp",c:"pantry"},{n:"garlic",q:3,u:"clove",c:"produce"},{n:"green onions",q:1,u:"bunch",c:"produce"},{n:"vegetable oil",q:2,u:"tbsp",c:"pantry"}],steps:["Fill your largest pot two-thirds with water, add a tablespoon of salt, cover, and bring it to a rolling boil. Cook the spaghetti for the time on the box, then drain it in a colander.","While the water heats, peel the garlic and chop it into tiny bits, and slice the green onions into thin rings.","Stir the soy sauce, sesame oil, brown sugar, ground ginger, cornstarch, and 3 tablespoons of water together in a small bowl until no lumps are left.","Heat the vegetable oil in your largest skillet over medium-high until it shimmers. Add the frozen vegetables straight from the bag and cook 5 minutes, stirring often, until they are hot and the water they release has cooked off.","Add the garlic and stir for 30 seconds.","Add the drained spaghetti, stir the sauce again, and pour it in. Toss for 2 minutes until the noodles are coated and no liquid pools in the bottom of the pan. Scatter the green onions over the top."]},{id:"potato-pea-curry",title:"Potato and Pea Curry",time:40,tags:["veggie","vegan"],ing:[{n:"baby potatoes",q:1.5,u:"lb",c:"produce"},{n:"frozen peas",q:1.5,u:"cup",c:"produce"},{n:"canned diced tomatoes",q:1,u:"can",c:"pantry"},{n:"light coconut milk",q:1,u:"can",c:"pantry"},{n:"mild curry powder",q:3,u:"tsp",c:"pantry"},{n:"garam masa , the parsley (leaves and thin stems both), the cumin, a teaspoon of salt, the flour, and the baking powder in a food processor. Pulse until it looks like coarse crumbs that hold together when you squeeze a handful. No food processor? Mash the chickpeas with a fork, chop the onion, garlic, and parsley very fine, and mix it all by hand.","Scoop the mix into 12 balls and press each into a patty about half an inch thick on the pan. Brush the tops with another tablespoon of olive oil.","Bake 25 minutes, flipping halfway with a thin spatula, until both sides are golden and firm to the touch.","Meanwhile, chop the cucumbers and tomatoes and toss them with the last tablespoon of olive oil, the juice of half the lemon, and a pinch of salt.","Stir the yogurt with the rest of the lemon juice and a pinch of salt. Build bowls: rice, patties, salad, and a spoon of sauce."]}],Gh=["produce","protein","dairy","grains","pantry"],fa={produce:"Produce",protein:"Meat and Protein",dairy:"Dairy and Eggs",grains:"Bread, Grains, and Pasta",pantry:"Pantry",staples:"From your pantry"},Yh=new Set(["olive oil","vegetable oil","toasted sesame oil","butter","low-sodium soy sauce","rice vinegar","Dijon mustard","ketchup","honey","maple syrup","brown sugar","cornstarch","all-purpose flour","baking powder","garlic powder","chili powder","mild curry powder","dried oregano","dried rosemary","Italian seasoning","smoked paprika","ground cumin","ground ginger","dried thyme","bay leaf","garam masala","onion powder"]),qn=[...Gh,"staples"],Xh={"ground turkey":{per:1,one:"tray (1 lb)",many:"trays (1 lb)"},"chicken tenderloins":{per:1.5,one:"pack (1.5 lb)",many:"packs (1.5 lb)"},eggs:{per:12,one:"dozen",many:"dozen"},"shredded cheddar":{per:2,one:"bag (8 oz)",many:"bags (8 oz)"},"plain Greek yogurt":{per:4,one:"tub (32 oz)",many:"tubs (32 oz)"},"cream cheese":{per:8,one:"brick (8 oz)",many:"bricks (8 oz)"},parmesan:{per:2,one:"container (8 oz)",many:"containers (8 oz)"},"penne pasta":{per:16,one:"box (16 oz)

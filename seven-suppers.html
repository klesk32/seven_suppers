en. Slice the pork into thick coins and serve with the potatoes and apples."]},{id:"ginger-pork-rice-bowls",v:"0.16.0",title:"Ginger Pork Rice Bowls",time:30,tags:["pork"],spice:"Add sriracha or chili crisp.",ing:[{n:"ground pork",q:1,u:"lb",c:"protein"},{n:"white rice",q:1.5,u:"cup",c:"grains"},{n:"coleslaw mix",q:1,u:"bag",c:"produce"},{n:"garlic",q:2,u:"clove",c:"produce"},{n:"low-sodium soy sauce",q:3,u:"tbsp",c:"pantry"},{n:"rice vinegar",q:1,u:"tbsp",c:"pantry"},{n:"ground ginger",q:1,u:"tsp",c:"pantry"},{n:"vegetable oil",q:1,u:"tbsp",c:"pantry"},{n:"toasted sesame oil",q:1,u:"tbsp",c:"pantry"},{n:"green onions",q:1,u:"bunch",c:"produce"}],steps:["Start the rice: rinse it, put it in a small pot with double its volume of water and a pinch of salt, bring to a boil, then cover on low heat for 15 minutes.","Heat the vegetable oil in a large skillet over medium-high heat. Add the pork and cook 6 to 8 minutes, breaking it into small crumbles. Wash your hands after handling the raw meat.","Push the crumbles into a mound and poke an instant-read thermometer into the middle: ground pork is done at 160 F. Cook 2 more minutes and check again if it reads low.","Peel and mince the garlic and add it with the ground ginger, soy sauce, and rice vinegar; stir 30 seconds.","Add the coleslaw mix and toss 2 minutes, just until it wilts but still has crunch. Turn off the heat and stir in the sesame oil.","Slice the green onions thin. Serve the pork over the rice with the green onions on top."]},{id:"skillet-pork-chops",v:"0.16.0",title:"Skillet Pork Chops with Smashed Potatoes and Peas",time:35,tags:["pork"],spice:"Add a dash of Frank's RedHot.",ing:[{n:"thick-cut boneless pork chops",q:1.5,u:"lb",c:"protein"},{n:"baby potatoes",q:1.5,u:"lb",c:"produce"},{n:"frozen peas",q:2,u:"cup",c:"produce"},{n:"olive oil",q:2,u:"tbsp",c:"pantry"},{n:"butter",q:1,u:"tbsp",c:"dairy"},{n:"garlic powder",q:1,u:"tsp",c:"pantry"},{n:"smoked paprika",q:.5,u:"tsp",c:"pantry"},{n:"lemon",q:1,u:"",c:"produce"}],steps:["Put the baby potatoes in a pot, cover with water and a big pinch of salt, and boil 12 to 15 minutes until a fork slides in with no resistance.","Pat the pork chops dry and sprinkle each side with the garlic powder, smoked paprika, and a pinch of salt. Wash your hands after handling the raw meat.","Heat the olive oil in a large skillet over medium-high heat. Lay the chops in and cook 4 to 5 minutes per side without moving them, so they brown. These times fit chops about an inch thick; thin half-inch chops need only 2 to 3 minutes per side.","Poke an instant-read thermometer through the side of the thickest chop into its middle: pork is done at 145 F with a blush of pink, which is safe and juicy. Cook 2 more minutes per side and check again if it reads low.","Move the chops to a plate and let them rest 5 minutes so the juices stay in.","Drain the potatoes, add the butter and a pinch of salt, and smash them roughly with a fork. Microwave the peas with a splash of water, covered, for 3 to 4 minutes, stirring halfway.","Serve the chops with the potatoes and peas, with the lemon in wedges for squeezing over."]}],Mf=["produce","protein","dairy","grains","pantry"],Tl={produce:"Produce",protein:"Meat and Protein",dairy:"Dairy and Eggs",grains:"Bread, Grains, and Pasta",pantry:"Pantry",staples:"From your pantry"},Of=new Set(["olive oil","vegetable oil","toasted sesame oil","butter","low-sodium soy sauce","rice vinegar","Dijon mustard","ketchup","honey","maple syrup","brown sugar","cornstarch","all-purpose flour","baking powder","garlic powder","chili powder","mild curry powder","dried oregano","dried rosemary","Italian seasoning","smoked paprika","ground cumin","ground ginger","dried thyme","bay leaf","garam masala","onion powder"]),Fn=[...Mf,"staples"],Df={"ground turkey":{per:1,one:"tray (1 lb)",many:"trays (1 lb)"},"lean ground beef":{per:1,one:"tray (1 lb)",many:"trays (1 lb)"},"ground pork":{per:1,one:"tray (1 lb)",many:"trays (1 lb)"},"chicken tenderl
